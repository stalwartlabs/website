title: Stalwart Mail Server | Stalwart Labs
description: >-
  Modern mail server with JMAP, IMAP4rev2, POP3 and SMTP, automated DNS and
  DKIM, ACME certificates, and disk quotas per user and tenant.
slug: /mail-server

hero:
  layout: stacked
  eyebrow: Mail server
  title: Mail server fluent in every protocol
  titleHighlight: every protocol
  lead: >-
    Stalwart speaks every standard mail protocol your users' clients
    already use, so no one in your fleet gets left behind. JMAP for new
    apps, IMAP for everything else. Storage,
    search, external directory and automated DNS are part of the same
    server, so what you install is one mail server, not a stack of
    services to glue together.
  ctas:
    - label: Get started
      href: /docs/install/
  meta:
    - Modern
    - Scalable
  visual:
    kind: screenshot
    src: /images/webadmin/dashboard-network-light.webp
    srcDark: /images/webadmin/dashboard-network-dark.webp
    width: 1440
    height: 900
    alt: Stalwart network dashboard with active and total connections per protocol and an inbound and outbound SMTP connections chart
    url: admin.stalw.art / Dashboard / Network

sections:
  - kind: feature
    eyebrow: JMAP
    title: First-class JMAP support.
    body: >-
      JMAP is the modern replacement for IMAP, designed around JSON over
      HTTP instead of the old line-based wire protocol. New mail appears
      the moment it arrives, every device stays in step, and the
      protocol is efficient enough to feel native to a mobile or web
      app. Stalwart supports every JMAP extension, so any compliant
      client gets the full feature set.
    bullets:
      - JMAP for Mail.
      - JMAP for Sieve Scripts.
      - JMAP over WebSocket.
      - JMAP Blob Management.
      - JMAP Quotas.
    learnMore:
      - label: Read the JMAP overview
        href: /docs/http/jmap/
    visual:
      kind: code
      lang: json
      filename: jmap-session.json
      body: |
        {
          "using": ["urn:ietf:params:jmap:core", "urn:ietf:params:jmap:mail"],
          "methodCalls": [
            ["Email/changes", { "accountId": "u1", "sinceState": "42" }, "0"],
            ["Email/get", {
              "accountId": "u1",
              "#ids": { "resultOf": "0", "name": "Email/changes", "path": "/created" },
              "properties": ["subject", "from", "receivedAt"]
            }, "1"]
          ]
        }

  - kind: feature
    reverse: true
    band: alt
    eyebrow: IMAP and POP3
    title: No client left behind.
    body: >-
      Stalwart ships full IMAP4rev2 with IMAP4rev1 fallback, plus a POP3
      server for older devices, so an existing fleet keeps working
      without forcing a client migration. Per-account quotas show up
      directly in the client, and users can edit their own server-side
      filters through any ManageSieve client.
    bullets:
      - IMAP4rev2 and IMAP4rev1 with dozens of supported extensions.
      - IMAP QUOTA reporting per account.
      - ManageSieve for user-managed server-side filters.
      - POP3 with STLS and SASL for older devices.
    visual:
      kind: diagram
      id: imap-client-grid

  - kind: feature
    eyebrow: Automated DNS
    title: Hands-off DNS for every mail domain.
    body: >-
      DNS is the most common reason a mail deployment breaks, and the
      hardest one for a generalist administrator to debug. Stalwart can
      publish and maintain a domain's records directly against a managed
      zone, so the manual copy-and-paste step that breaks the most
      deployments goes away. Records reconcile on save, propagation is
      checked before a key is activated, and ACME DNS challenges run
      through the same automation.
    bullets:
      - Direct integration with Cloudflare, Route 53, Google Cloud DNS, DigitalOcean, OVH and others.
      - Dynamic DNS updates with TSIG or SIG(0) for self-hosted authoritative servers.
      - Automatic publication of MX, SPF, DKIM, DMARC, TLSA and autoconfig records.
    learnMore:
      - label: Read DNS records
        href: /docs/domains/dns-records
    visual:
      kind: diagram
      id: dns-records-tile

  - kind: feature
    reverse: true
    band: alt
    eyebrow: Automated DKIM rotation
    title: DKIM keys, rotated on a schedule.
    body: >-
      Rotating DKIM signing keys on a schedule is recommended practice
      and easy to forget under operational pressure. Stalwart owns the
      full lifecycle: new keys are generated on schedule, published in
      DNS, activated only after propagation is observed, then retired
      and deleted on configurable timers.
    bullets:
      - Per-domain rotation cadence.
      - Selector templating with date and version variables.
      - Emergency rotation on demand for suspected key compromise.
    learnMore:
      - label: Read DKIM rotation
        href: /docs/domains/dkim-rotation
    visual:
      kind: screenshot
      src: /images/webadmin/dkim-signatures-light.webp
      srcDark: /images/webadmin/dkim-signatures-dark.webp
      width: 940
      alt: Stalwart DKIM signatures list with RSA and Ed25519 keys per domain and their rotation stage
      url: admin.stalw.art / Domains / DKIM Signatures

  - kind: feature
    eyebrow: ACME and TLS
    title: Automatic TLS certificates with ACME.
    body: >-
      Expired TLS certificates are a routine cause of avoidable outages.
      Stalwart implements ACME directly so renewals run well before
      expiry, every supported challenge type is available, and TLSA
      records are refreshed alongside the new certificate so DANE keeps
      validating without a second tool in the loop.
    bullets:
      - Every supported ACME challenge type.
      - External Account Binding for CAs that require it.
      - On-demand renewal triggered after a DNS update.
      - Automatic TLSA refresh after each rotation.
    learnMore:
      - label: Read the ACME overview
        href: /docs/server/tls/acme/
    visual:
      kind: diagram
      id: acme-lifecycle

  - kind: feature
    reverse: true
    band: alt
    eyebrow: Encryption at rest
    title: Mailbox encryption with each user's own key.
    body: >-
      A stolen disk, a leaked backup or a curious administrator should
      not expose anyone's mail. Each user can register their own
      OpenPGP key or S/MIME certificate, and Stalwart encrypts every
      incoming message with it before the message is stored. The
      server only ever holds the public half of the key; the private
      key that opens the mail stays on the user's devices, so the
      stored mailbox cannot be read on the server by anyone, including
      the people who run it. Users manage their own keys from the
      self-service portal, and their usual OpenPGP- or S/MIME-capable
      mail client decrypts the messages.
    bullets:
      - OpenPGP v4 and v6 keys (RFC 9580) and S/MIME certificates.
      - Post-quantum ML-KEM keys for OpenPGP (RFC 9980) and S/MIME (RFC 9936).
      - Header protection (RFC 9788) for tamper-evident Subject, From and To.
      - Optional encryption of sent copies and drafts uploaded by clients.
      - Per-user choice to keep spam-filter training private.
    learnMore:
      - label: Read encryption at rest
        href: /docs/encryption/at-rest
      - label: Read the encryption overview
        href: /docs/encryption/
    visual:
      kind: diagram
      id: encryption-algorithms

  - kind: feature
    eyebrow: Encryption gateway
    title: Outbound encryption, with nothing to install for the sender.
    body: >-
      End-to-end encryption usually fails on logistics: senders need
      the right software, and they need the recipient's key. The
      Stalwart encryption gateway takes both off their hands. When a
      message leaves for another domain, the server looks up each
      recipient's public key, encrypts a separate copy for every
      recipient that has one, and signs it again with DKIM so it still
      passes authentication. Policies decide whether a missing key
      means sending the message as is or refusing it, and the Subject
      can be hidden from every server along the way.
    bullets:
      - Opportunistic or required encryption, decided per recipient, domain or sender.
      - Key discovery over Web Key Directory, keys.openpgp.org and HKP keyservers.
      - DNSSEC-validated OPENPGPKEY (RFC 7929) and SMIMEA (RFC 8162) records.
      - Keys harvested from S/MIME signatures and Autocrypt headers of DMARC-authenticated mail.
      - S/MIME certificate validation with revocation checks.
      - Subject hiding through header protection (RFC 9788).
    learnMore:
      - label: Read the encryption gateway
        href: /docs/encryption/gateway
      - label: Read key discovery
        href: /docs/encryption/external-keys
    visual:
      kind: diagram
      id: encryption-gateway

  - kind: feature
    reverse: true
    band: alt
    eyebrow: Autoconfig and Autodiscover
    title: Automatic client configuration.
    body: >-
      Helpdesk tickets that begin "I can't get my email set up"
      disappear when a client can fetch its own settings from the
      server. Pointing a mail client at a Stalwart server returns IMAP,
      POP, SMTP, CalDAV and CardDAV settings without the user typing a
      host name. The modern UA Autoconfig discovery is served alongside
      the legacy Mozilla Autoconfig and Microsoft Autodiscover v1 and
      v2 formats, so old and new clients are both covered.
    bullets:
      - Modern UA Autoconfig discovery.
      - Mozilla Autoconfig for older Thunderbird-based clients.
      - Microsoft Autodiscover v1 and v2 for Outlook and Exchange clients.
    learnMore:
      - label: Read Autoconfig
        href: /docs/server/autoconfig
    visual:
      kind: diagram
      id: autoconfig

  - kind: feature
    eyebrow: Multi-tenancy and quotas
    title: Multi-tenant from the ground up.
    body: >-
      Stalwart was built for multi-tenancy from the start, so hosting
      many organisations on the same deployment stays safe by design.
      Accounts, domains and tenants are fully isolated; disk quotas are
      enforced per user and per tenant; aliases and catch-all addresses
      can be enabled, disabled or annotated; and a whole domain can be
      redirected onto another without touching the mailboxes underneath.
    bullets:
      - Multi-tenant by design, with per-tenant administrators and quotas.
      - Domain aliases (one domain pointing at another).
      - Email aliases with descriptions; the alias mechanism can be disabled per account.
      - Plus-addressing, sub-addressing, catch-all and mailing-list expansion.
      - Disk quotas per user and per tenant.
    visual:
      kind: screenshot
      src: /images/webadmin/accounts-list-light.webp
      srcDark: /images/webadmin/accounts-list-dark.webp
      width: 940
      alt: Stalwart accounts directory listing users across several domains with full name and creation date
      url: admin.stalw.art / Directory / Accounts

  - kind: feature
    reverse: true
    band: alt
    eyebrow: Sieve scripting
    title: Filter, route and rewrite without leaving the server.
    body: >-
      Mail rules belong on the server, where they apply to every device
      a user opens. Stalwart includes a full Sieve interpreter with every
      registered extension. User scripts run sandboxed and are managed
      through any standard ManageSieve client or JMAP; administrators
      run trusted scripts at SMTP stages with elevated permissions.
    bullets:
      - Every IANA-registered Sieve extension.
      - ManageSieve and JMAP for Sieve Scripts management.
      - Trusted and untrusted execution contexts.
    visual:
      kind: code
      lang: sieve
      filename: filter.sieve
      body: |
        require ["fileinto", "imap4flags", "vacation", "envelope"];

        # Newsletters land in their own folder.
        if header :contains "List-Id" "@" {
          fileinto "INBOX/Newsletters";
          stop;
        }

        # Tag and route monitoring alerts.
        if envelope :is "from" "alerts@monitoring.example.com" {
          addflag "\\Flagged";
          fileinto "INBOX/Alerts";
          stop;
        }

        # Out-of-office reply, once per sender per week.
        vacation :days 7
          "I am away until Monday. Will reply on return.";

  - kind: feature
    eyebrow: Web admin
    title: Manage everything from a browser.
    body: >-
      Day-to-day administration happens in a browser, not in a config
      file or an SSH session. Account, domain, group and mailing-list
      management; SMTP queue and report visualisation; configuration of
      every server object; a log viewer with search; and a self-service
      portal for password reset, passkeys and encryption-at-rest key management,
      all in one console.
    bullets:
      - Real-time dashboards and live tracing.
      - Account, domain, group, list and Sieve management.
      - Queue and report visualisation for DMARC, TLS-RPT and ARF.
      - Configuration of every server object from a single web admin.
    visual:
      kind: screenshot
      src: /images/webadmin/network-settings-light.webp
      srcDark: /images/webadmin/network-settings-dark.webp
      alt: Stalwart network settings form with default hostname, default domain, TLS certificate and connection limits
      url: admin.stalw.art / Settings / Network / General

