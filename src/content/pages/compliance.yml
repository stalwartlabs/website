title: Compliance | Stalwart Labs
description: >-
  Retention policies, legal hold, eDiscovery, journaling and a tamper-evident
  audit trail for Stalwart, as an add-on to the Enterprise edition.
slug: /compliance

hero:
  eyebrow: Compliance add-on
  title: Retention, legal hold and eDiscovery for Stalwart
  titleHighlight: legal hold and eDiscovery
  lead: >-
    The Compliance add-on gives organisations with record-keeping
    obligations the tools to keep what they must, delete what they
    should, and find any message when a regulator, auditor or court
    asks for it. Retention policies, legal holds, cross-mailbox search,
    export and journaling run inside the Stalwart server, under roles
    that keep compliance work separate from day-to-day administration,
    and every action is recorded in an audit trail in which any change
    is detectable.
