title: Pricing | Stalwart Labs
description: >-
  Per-mailbox pricing for the Stalwart Enterprise edition, with tiered
  annual rates from 25 to 10 million-plus mailboxes.
slug: /pricing

hero:
  eyebrow: Pricing
  title: More features than the alternatives, for less.
  titleHighlight: for less
  lead: >-
    Stalwart Enterprise gives you a complete mail and collaboration
    platform for a per-mailbox rate that drops as you grow. Every license
    includes unlimited domains, tenants, mailing lists and
    aliases at no extra cost, and the same license can be installed on
    an unlimited number of servers.
  ctas:
    - label: Buy now
      href: https://account.stalw.art/buy
      external: true
    - label: Start a 30-day trial
      href: https://account.stalw.art/trial
      external: true
      primary: false
    - label: Contact sales
      href: /contact
      primary: false
  aside:
    title: Unlimited, at no extra cost
    items:
      - { label: domains, icon: globe }
      - { label: tenants, icon: building-2 }
      - { label: mailing lists, icon: mails }
      - { label: aliases, icon: at-sign }
      - { label: servers, icon: server }

sections:
  - kind: chapter
    title: Rates
    icon: receipt

  - kind: pricing-tiers
    eyebrow: Tier rates
    title: Each tier billed at its own rate.
    body: >-
      The total bill for a given deployment combines the rates across the
      tiers it spans. A 600-mailbox deployment, for example, is charged
      the rate for 25-499 on the first 499 mailboxes and the rate for
      500-999 on the remainder.
    showTableBelow: 100000
    quoteCta:
      label: Obtain quote
      href: /contact
    tiers:
      - { lower: 25,         upper: 499,        eur: 2.00, usd: 2.40 }
      - { lower: 500,        upper: 999,        eur: 1.70, usd: 2.04 }
      - { lower: 1000,       upper: 4999,       eur: 1.45, usd: 1.74 }
      - { lower: 5000,       upper: 10000,      eur: 1.23, usd: 1.48 }
      - { lower: 10000,      upper: 49999,      eur: 1.04, usd: 1.25 }
      - { lower: 50000,      upper: 99999,      eur: 0.89, usd: 1.09 }
      - { lower: 100000,     upper: 499999,     eur: 0.75, usd: 0.90 }
      - { lower: 500000,     upper: 999999,     eur: 0.64, usd: 0.78 }
      - { lower: 1000000,    upper: 9999999,    eur: 0.54, usd: 0.65 }
      - { lower: 10000000,   upper: null,       eur: 0.46, usd: 0.55 }

  - kind: calculator
    band: alt
    eyebrow: Calculate
    title: Estimate your annual cost.
    body: >-
      Drag the slider or type a mailbox count. The total uses the same
      tiered rates above. Premium Support is included with every
      Enterprise subscription.

  - kind: chapter
    title: Licensing
    icon: key-round
    summary: Subscription terms · License issuance

  - kind: prose
    eyebrow: Licensing
    title: Per-mailbox subscription, annual or monthly.
    body: >-
      These prices are for the Enterprise edition of **Stalwart
      On-Premise**, the name for Stalwart running on your own
      infrastructure in either edition. Stalwart
      Enterprise Cloud, operated by Stalwart Labs, is described on the
      [Enterprise Cloud page](/cloud).

      Two billing cycles are available: **annual** and **monthly**, 
      for organisations that prefer a shorter commitment.

      Only user and group mailboxes count toward the total. Mailing 
      lists and aliases are not billed. Every plan
      includes unlimited domains, tenants, mailing lists and
      aliases at no extra cost.

  - kind: list
    band: alt
    title: License issuance.
    body: >-
      After purchase at the [Stalwart Labs licensing portal](https://account.stalw.art/buy),
      the key is available immediately and activates Enterprise features
      as soon as it is installed on the server. A 30-day Enterprise trial
      is available at the [trial portal](https://account.stalw.art/trial),
      with full access to Enterprise features for evaluation.
    bullets:
      - "**One key per customer.** Your subscription has a single license key, which carries your mailbox count."
      - "**Anchored to a hostname domain**, not to an individual server. The same key installs on an unlimited number of servers under that domain, such as every host under `*.example.org`."
      - "**Growing replaces the key, it does not add one.** Buying more mailbox licenses raises the mailbox count of your key; install the updated key in place of the old one."
      - "**Unlimited client domains**: the domain restriction applies only to server hostnames, not to the domains your users send and receive mail under."
      - "**Cancellation reverts to Community.** Enterprise-only features are disabled, but no data is lost and service continues without interruption."

  - kind: chapter
    title: Support and add-ons
    icon: life-buoy

  - kind: prose
    eyebrow: Premium Support
    title: Premium Support is included with every subscription.
    body: >-
      Every Enterprise subscription, whatever its size, includes
      Premium Support: a private Priority Support area on the
      [support portal](https://support.stalw.art) and email support at
      [support@stalw.art](mailto:support@stalw.art), with tickets
      queued ahead of community requests and handled by the engineers
      who write Stalwart. Premium Support does not carry a response
      commitment; organisations that need contractual response times
      can add an Incident Pack or one of the SLA plans described on the
      [Support Plans page](/support).

  - kind: list
    band: alt
    eyebrow: Add-ons and services
    title: Extend the subscription with add-ons, SLAs and services.
    body: >-
      The following are not part of the Enterprise license and are
      priced separately. A quote and a pro-forma invoice for any of
      them can be obtained from the
      [licensing portal](https://account.stalw.art).
    bullets:
      - "**[Compliance](/compliance).** Retention policies, legal hold, eDiscovery, journaling and access auditing."
      - "**[Lawful Interception](/lawful-interception) and LI Handover.** Warrant and target management with real-time capture, and ETSI handover to the authorities as a separate add-on, for Stalwart On-Premise."
      - "**[Support Plans](/support).** An Incident Pack, or an SLA plan with guaranteed initial response times from two business days down to one hour, with Severity 1 handled around the clock on SLA 4 and SLA 2. SLA plans require a yearly subscription."
      - "**[Professional Services](/services).** Onboarding, health checks, upgrade assistance and lawful-interception compliance assistance."

  - kind: chapter
    title: FAQ
    icon: message-circle-question-mark

  - kind: faq
    eyebrow: Frequently asked
    title: Pricing FAQ.
    items:
      - question: Can I purchase fewer than 25 mailboxes?
        answer: >-
          Not at the moment: 25 mailboxes is the smallest Enterprise
          subscription. If your organisation has fewer users, a
          25-mailbox license still covers you fully, leaves room to
          grow, and can be extended with more mailboxes at any time.
          If you do not need Enterprise features, the Community edition
          is free, with no mailbox limit.
      - question: Can I move the license to a different server?
        answer: >-
          Yes, as long as the server hostname falls under the licensed
          domain (for example, anywhere under `*.example.org`).
      - question: Do I need a separate license for each region or data centre?
        answer: >-
          No. One key covers every server under the licensed hostname
          domain, regardless of where it runs.
      - question: What happens if my mailbox count exceeds my plan mid-cycle?
        answer: >-
          Existing mailboxes keep working without restriction; the
          server simply stops creating new mailboxes once your licensed
          count is reached. To unblock new mailboxes, buy additional
          mailbox licenses at [account.stalw.art](https://account.stalw.art):
          they raise the mailbox count of your existing key. Install the
          updated key in place of the old one on your server or cluster; keys do not
          stack. There is no downtime, and the system generates a prorated
          invoice for the remaining period.
      - question: Can I purchase additional mailboxes mid-cycle?
        answer: >-
          Yes. Buy more mailbox licenses at
          [account.stalw.art](https://account.stalw.art) at any time
          during your billing period. Your single license key is updated
          with the new mailbox count; install the updated key in place of
          the old one on your server or cluster. It takes effect without a restart,
          and the system charges only for the prorated remainder of the
          cycle.
      - question: Can I switch between monthly and annual billing?
        answer: >-
          Yes, in either direction. The change is applied at
          [account.stalw.art](https://account.stalw.art) and takes
          effect without downtime; the system reconciles the change
          with a prorated invoice for the rest of the period.
      - question: What happens if I cancel my Enterprise subscription?
        answer: >-
          The server reverts to the Community edition automatically.
          Enterprise-only features are disabled, but no data is lost
          and standard email and collaboration service continues
          without interruption.

