 class="t2" x="770.0" y="1036" text-anchor="middle">1,000x</text><text class="t2" x="16" y="1056">¶ Stalwart build a665cdfa; see the table footnotes.</text><text class="t2" x="16" y="1078">‡ Stalwart build 2d80f00b; see the table footnotes.</text><rect class="s" x="440.0" y="99" width="81.7" height="14" rx="3"><title>Log in with a full TLS handshake (16 sessions): Stalwart, 5.5x</title></rect><text class="t1" x="526.7" y="110" text-anchor="start">5.5x</text><rect class="s" x="440.0" y="119" width="15.1" height="14" rx="3"><title>STATUS of every folder: Stalwart, 1.4x</title></rect><text class="t1" x="460.1" y="130" text-anchor="start">1.4x</text><rect class="s" x="440.0" y="139" width="27.2" height="14" rx="3"><title>Open the INBOX (SELECT) ¶: Stalwart, 1.8x</title></rect><text class="t1" x="472.2" y="150" text-anchor="start">1.8x</text><rect class="s" x="440.0" y="159" width="18.3" height="14" rx="3"><title>Resync after 100 flag changes (SELECT QRESYNC) ¶: Stalwart, 1.5x</title></rect><text class="t1" x="463.3" y="170" text-anchor="start">1.5x</text><rect class="s" x="440.0" y="179" width="38.7" height="14" rx="3"><title>Fetch the flags of the whole INBOX: Stalwart, 2.2x</title></rect><text class="t1" x="483.7" y="190" text-anchor="start">2.2x</text><rect class="s" x="440.0" y="199" width="87.6" height="14" rx="3"><title>Fetch a 1 MB message: Stalwart, 6.3x</title></rect><text class="t1" x="532.6" y="210" text-anchor="start">6.3x</text><rect class="s" x="440.0" y="219" width="24.5" height="14" rx="3"><title>Search message bodies for a common word: Stalwart, 1.7x</title></rect><text class="t1" x="469.5" y="230" text-anchor="start">1.7x</text><rect class="s" x="440.0" y="239" width="37.3" height="14" rx="3"><title>Search by sender (SEARCH FROM): Stalwart, 2.2x</title></rect><text class="t1" x="482.3" y="250" text-anchor="start">2.2x</text><rect class="s" x="440.0" y="259" width="57.0" height="14" rx="3"><title>Sort the INBOX by date: Stalwart, 3.3x</title></rect><tex